
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10111b">
<title>Roblox AI Shorts Studio 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111b;color:#fff;font-family:Arial,sans-serif}
header{padding:16px;background:#191a29;border-bottom:1px solid #34344b}
header h2{margin:0;color:#b49aff}
header p{color:#aaa;font-size:13px;margin-bottom:0}
.app{max-width:1100px;margin:auto;padding:12px}
.panel{background:#191a29;padding:14px;margin:12px 0;border-radius:13px}
h3{color:#c4b5fd;margin-top:0}
button{background:#7654ed;color:white;border:0;border-radius:8px;padding:11px 14px;margin:4px;cursor:pointer}

textarea{min-height:90px;resize:vertical}
.preview{background:#080910;padding:10px;border-radius:14px;display:flex;justify-content:center}

.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1}
@media(min-width:800px){
.app{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.previewPanel{grid-row:span 2}
}
</style>
</head>
<body>
<header>
<h2>🎮 Roblox AI Shorts Studio 3D</h2>
<p>Create 3D Roblox-inspired stories and vertical Shorts</p>
</header>
<main class="app">
<section class="panel previewPanel">
<h3>🎬 3D Video Preview</h3>
<div class="preview"><canvas id="gameCanvas"></canvas></div>
<div id="subtitle"></div>
<p id="sceneStatus" class="small">Loading 3D world...</p>
<div class="row">
<button onclick="playScene()">▶ Play</button>

</div>

<button onclick="previousScene()">← Previous</button>
<button onclick="nextScene()">Next →</button>
</div>

<section class="panel">
<h3>📖 Story Generator</h3>
<input id="storyTopic" placeholder="Example: Two friends enter a haunted school">
<select id="genre">

<option>Friendship</option><option>Siblings</option>
<option>School</option><option>Adventure</option>
<option>Emotional</option><option>Survival</option>
<option>Rich vs Poor</option><option>Mystery</option>
<option>Superhero</option><option>Gaming Challenge</option>
</select>
<select id="duration">

<option value="45">45 seconds</option>
<option value="60" selected>60 seconds</option>
<option value="90">90 seconds</option>
</select>
<button onclick="generateStory()">✨ Generate Full Story</button>
<div id="storyOutput"></div>
</section>

<section class="panel">
<h3>👥 Character Studio</h3>
<div id="characterList"></div>
<button onclick="addCharacter()">+ Add Character</button>
</section>

<section class="panel">
<h3>🎙️ Voice Studio</h3>
<select id="voiceSelect"></select>
<button onclick="previewVoice()">Test Voice</button>
<button onclick="playDialogue()">Play Story Dialogue</button>
<button onclick="stopVoice()">Stop Voice</button>
</section>

<section class="panel">
<h3>🎥 Video Export</h3>
<select id="quality">

</select>

<h3>📱 YouTube SEO Assistant</h3>
<button onclick="generateSEO()">Generate Upload Package</button>
<div id="seoOutput"></div>
</section>
</main>
<script>
  
const canvas=document.getElementById("gameCanvas");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(390,693,false);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const world=new THREE.Scene();
world.background=new THREE.Color(0x83c9f5);
world.fog=new THREE.Fog(0x83c9f5,18,55);

const camera=new THREE.PerspectiveCamera(42,390/693,.1,100);
camera.position.set(0,4.5,12);
camera.lookAt(0,1.5,0);

world.add(new THREE.HemisphereLight(0xffffff,0x657080,2));
const sunlight=new THREE.DirectionalLight(0xffffff,2.2);
sunlight.position.set(-5,10,8);
sunlight.castShadow=true;
world.add(sunlight);

function material(color){
return new THREE.MeshStandardMaterial({color,roughness:.8});
}
function cube(w,h,d,color,x,y,z,parent=world){
const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
mesh.position.set(x,y,z);
mesh.castShadow=true;
mesh.receiveShadow=true;
parent.add(mesh);
return mesh;
}

function clearEnvironment(){
const remove=[];
world.children.forEach(o=>{
if(o.userData.environment)remove.push(o);
});
remove.forEach(o=>world.remove(o));
}

function envCube(w,h,d,color,x,y,z){
const m=cube(w,h,d,color,x,y,z);
m.userData.environment=true;
return m;
}

function buildEnvironment(type="Street"){
clearEnvironment();
envCube(50,.3,50,0x4c9b52,0,-.2,0);

if(type==="School"){
envCube(12,5,3,0xe8d7ae,0,2.3,-5);
envCube(3,2,1,0x4c82b5,-3,1,-3);
envCube(3,2,1,0x4c82b5,3,1,-3);
envCube(2,3,.3,0x49362b,0,1.3,-3.4);
}else if(type==="House"){
envCube(9,5,6,0xe4b98a,0,2.3,-5);
envCube(10,.5,7,0x8b4545,0,5,-5);
envCube(2,3,.3,0x513528,0,1.3,-1.9);
envCube(1.3,1.3,.2,0x8dd8f5,-2,3,-1.9);
envCube(1.3,1.3,.2,0x8dd8f5,2,3,-1.9);
}else if(type==="Forest"){
for(let i=0;i<12;i++){
let x=(Math.random()-.5)*22;
let z=-3-Math.random()*20;
envCube(.6,3,.6,0x674329,x,1.4,z);
envCube(2.8,2.8,2.8,0x236a35,x,3.5,z);
}
}else{
envCube(50,.15,8,0x55565c,0,-.02,-5);
envCube(8,3,.3,0xe7c69d,-7,1.4,-10);
envCube(8,3,.3,0xd8a8a0,7,1.4,-10);
}
}

buildEnvironment();
  
const characters=[];
const skinColors=[0xffc28e,0xe0a06c,0x8d573c,0xf0c6a0];
const outfitColors=[0x2878db,0xd83b45,0x25a66a,0x8b55c5];

function makeCharacter(name,color=0x2878db,skin=0xffc28e){
const group=new THREE.Group();
const parts={};

parts.body=cube(1,1.25,.5,color,0,1.65,0,group);
parts.head=cube(.85,.85,.8,skin,0,2.75,0,group);
parts.leftArm=cube(.3,1,.35,skin,-.68,1.7,0,group);
parts.rightArm=cube(.3,1,.35,skin,.68,1.7,0,group);
parts.leftLeg=cube(.38,.9,.4,0x303b65,-.25,.6,0,group);
parts.rightLeg=cube(.38,.9,.4,0x303b65,.25,.6,0,group);

parts.leftArm.position.set(-.68,1.8,0);
parts.rightArm.position.set(.68,1.8,0);

const eyeMat=material(0x171717);
const eye1=new THREE.Mesh(new THREE.BoxGeometry(.11,.12,.05),eyeMat);
const eye2=eye1.clone();
eye1.position.set(-.19,2.8,.415);
eye2.position.set(.19,2.8,.415);
group.add(eye1,eye2);

const mouth=cube(.22,.045,.04,0x6c2424,0,2.57,.43,group);

group.position.set(characters.length===0?-.9:1.1,0,0);
group.userData.parts=parts;
group.userData.name=name;
group.userData.mouth=mouth;
group.userData.baseX=group.position.x;
group.userData.walking=false;
world.add(group);

const character={name,color,skin,group,parts};
characters.push(character);
return character;
}

function addCharacter(name,color,skin){
if(characters.length>=5)return alert("Maximum 5 characters");
const n=name||"Character "+(characters.length+1);
const c=makeCharacter(
n,
color||outfitColors[characters.length%outfitColors.length],
skin||skinColors[characters.length%skinColors.length]
);
renderCharacterList();
return c;
}

function renderCharacterList(){
const box=document.getElementById("characterList");
box.innerHTML="";
characters.forEach((c,i)=>{
const div=document.createElement("div");
div.className="sceneCard";
div.innerHTML=`
<input value="${c.name}" aria-label="Character name">
<label class="small">Outfit colour</label>
<input type="color" value="#${c.color.toString(16).padStart(6,"0")}">
<label class="small">Skin colour</label>
<input type="color" value="#${c.skin.toString(16).padStart(6,"0")}">
<button>Update Character</button>`;
const inputs=div.querySelectorAll("input");
div.querySelector("button").onclick=()=>{
c.name=inputs[0].value||c.name;
c.color=parseInt(inputs[1].value.slice(1),16);
c.skin=parseInt(inputs[2].value.slice(1),16);
c.parts.body.material.color.setHex(c.color);
c.parts.head.material.color.setHex(c.skin);
c.parts.leftArm.material.color.setHex(c.skin);
c.parts.rightArm.material.color.setHex(c.skin);
c.group.userData.name=c.name;
renderCharacterList();
};
box.appendChild(div);
});
}

addCharacter("Nooby",0x2878db,0xffc28e);
addCharacter("Bacon",0x9b5b30,0xe0a06c);

function positionCharacters(){
characters.forEach((c,i)=>{
c.group.position.x=(i-(characters.length-1)/2)*1.8;
c.group.position.z=0;
});
}

function animateCharacters(time){
characters.forEach((c,i)=>{
const p=c.parts;
if(c.group.userData.walking){
const swing=Math.sin(time*.009+i)*.65;
p.leftLeg.rotation.x=swing;
p.rightLeg.rotation.x=-swing;
p.leftArm.rotation.x=-swing*.7;
p.rightArm.rotation.x=swing*.7;
}else{
p.leftLeg.rotation.x=0;
p.rightLeg.rotation.x=0;
p.leftArm.rotation.x=0;
p.rightArm.rotation.x=0;
}
c.group.userData.mouth.scale.y=c.group.userData.talking?1.8:1;
});
}

function setTalking(name){
characters.forEach(c=>{
c.group.userData.talking=c.name===name;
});
}

function setWalking(name,on){
const c=characters.find(x=>x.name===name);
if(c)c.group.userData.walking=on;
}
  
let scenes=[];
let currentScene=0;
let playing=false;
let playTimer=null;
let dialogueIndex=0;

const storyTemplates=[
{
title:"The Strange Message",
description:"A quiet afternoon outside school. The friends are about to go home.",
place:"School",
action:"Nooby checks his phone and suddenly stops walking.",
lines:[
["Nooby","Wait... who sent me this strange message?"],

],

},
{

],

},
{
title:"The Locked Door",

lines:[
["Nooby","This place looks even worse up close."],
["Bacon","Let's just go back home, please."],
["Nooby","The door is already open."],

["Bacon","Why did you call out? Now it knows we're here!"]
],
end:"The door slams shut behind them."
},
{
title:"A Voice in the Dark",
description:"Inside the mansion, the lights flicker and a strange voice echoes.",

lines:[

},
{

},

function generateStory(){
const topic=document.getElementById("storyTopic").value.trim()||"Two friends discover a mystery";
const genre=document.getElementById("genre").value;
const duration=Number(document.getElementById("duration").value);
const templates=storyTemplates;
scenes=templates.map((t,i)=>({
title:t.title,
description:t.description,
place:t.place,
action:t.action,
lines:t.lines.map(x=>({speaker:x[0],text:x[1]})),
end:t.end,
duration:duration/6
}));
scenes[0].description=topic+". "+scenes[0].description;
scenes.forEach(s=>s.genre=genre);
currentScene=0;
renderStory();
loadScene(0);
}

function renderStory(){
const out=document.getElementById("storyOutput");
out.innerHTML="";
scenes.forEach((s,i)=>{
const card=document.createElement("div");
card.className="sceneCard";
const heading=document.createElement("h4");
heading.textContent="Scene "+(i+1)+": "+s.title;
const desc=document.createElement("p");
desc.textContent=s.description;
const action=document.createElement("p");
action.textContent="🎬 Action: "+s.action;
const lines=document.createElement("p");
lines.textContent=s.lines.map(l=>l.speaker+": "+l.text).join("\n");
const ending=document.createElement("p");
ending.textContent="⚡ Ending: "+s.end;
const edit=document.createElement("button");
edit.textContent="Edit Scene";
edit.onclick=()=>editScene(i);
card.append(heading,desc,action,lines,ending,edit);
out.appendChild(card);
});
}

function editScene(i){
const s=scenes[i];
const title=prompt("Scene title:",s.title);
if(title!==null)s.title=title;
const desc=prompt("Scene description:",s.description);
if(desc!==null)s.description=desc;
const action=prompt("Opening action:",s.action);
if(action!==null)s.action=action;
s.lines.forEach((line,j)=>{
const value=prompt(line.speaker+" dialogue:",line.text);
if(value!==null)line.text=value;
});
const ending=prompt("Scene ending:",s.end);
if(ending!==null)s.end=ending;
renderStory();
loadScene(i);
  }
  
function loadScene(index){
if(!scenes.length)return;
currentScene=Math.max(0,Math.min(index,scenes.length-1));
const s=scenes[currentScene];
buildEnvironment(s.place);
positionCharacters();
characters.forEach(c=>{
c.group.userData.walking=false;
c.group.userData.talking=false;
});
camera.position.set(0,4.3,12);
camera.lookAt(0,1.6,0);
document.getElementById("sceneStatus").textContent=
"Scene "+(currentScene+1)+" / "+scenes.length+" — "+s.title;
document.getElementById("subtitle").textContent=s.description;
}

function nextScene(){
if(!scenes.length)return;
stopScene();
loadScene((currentScene+1)%scenes.length);
}

function previousScene(){
if(!scenes.length)return;
stopScene();
loadScene((currentScene-1+scenes.length)%scenes.length);
}

function playScene(){
if(!scenes.length)generateStory();
stopScene();
playing=true;
runCurrentScene();
}

function stopScene(){
playing=false;
clearTimeout(playTimer);
playTimer=null;
stopVoice();
characters.forEach(c=>{
c.group.userData.walking=false;
c.group.userData.talking=false;
});
}

function runCurrentScene(){
if(!playing||!scenes.length)return;
const s=scenes[currentScene];
let step=0;
document.getElementById("subtitle").textContent=s.action;
const speaker=characters[0];
if(speaker){
speaker.group.userData.walking=true;
speaker.group.position.x=-.4;
}
camera.position.set(-1,4,10);
camera.lookAt(0,1.5,0);

playTimer=setTimeout(()=>{
if(!playing)return;
characters.forEach(c=>c.group.userData.walking=false);
showNextLine();
},1800);

function showNextLine(){
if(!playing)return;
if(step>=s.lines.length){
document.getElementById("subtitle").textContent=s.end;
setTalking("");
playTimer=setTimeout(()=>{
if(!playing)return;
currentScene++;
if(currentScene>=scenes.length){
stopScene();
document.getElementById("subtitle").textContent="THE END";
return;
}
loadScene(currentScene);
runCurrentScene();
},2500);
return;
}
const line=s.lines[step++];
document.getElementById("subtitle").textContent=
line.speaker+": "+line.text;
setTalking(line.speaker);
const c=characters.find(x=>x.name===line.speaker);
if(c){
camera.position.set(c.group.position.x,3.5,8);
camera.lookAt(c.group.position.x,1.9,0);
}
playTimer=setTimeout(showNextLine,Math.max(1800,line.text.length*65));
}
}

let rafTime=0;
function renderLoop(time){
requestAnimationFrame(renderLoop);
rafTime=time;
animateCharacters(time);
renderer.render(world,camera);
}
renderLoop(0);

window.addEventListener("resize",()=>{
renderer.setSize(390,693,false);
});
  
let availableVoices=[];

function loadVoices(){
if(!("speechSynthesis" in window))return;
availableVoices=speechSynthesis.getVoices();
const select=document.getElementById("voiceSelect");
select.innerHTML="";
availableVoices.forEach((v,i)=>{
const option=document.createElement("option");
option.value=i;
option.textContent=v.name+" ("+v.lang+")";
select.appendChild(option);
});
}

if("speechSynthesis" in window){
loadVoices();
speechSynthesis.onvoiceschanged=loadVoices;
}

function speak(text,voiceIndex,onend){
if(!("speechSynthesis" in window)){
if(onend)onend();
return;
}
const utterance=new SpeechSynthesisUtterance(text);
const v=availableVoices[voiceIndex];
if(v)utterance.voice=v;
utterance.rate=1;
utterance.pitch=1;
utterance.onend=()=>{if(onend)onend();};
speechSynthesis.speak(utterance);
}

function previewVoice(){
const index=Number(document.getElementById("voiceSelect").value);
speechSynthesis.cancel();
speak("Hello! Welcome to Roblox AI Shorts Studio.",index);
}

function stopVoice(){
if("speechSynthesis" in window)speechSynthesis.cancel();
}

function playDialogue(){
if(!scenes.length){
alert("Generate a story first.");
return;
}
stopVoice();
let si=0,li=0;
function next(){
if(si>=scenes.length)return;
const s=scenes[si];
if(li>=s.lines.length){
si++;li=0;
next();
return;
}
const line=s.lines[li++];
document.getElementById("subtitle").textContent=
line.speaker+": "+line.text;
setTalking(line.speaker);
const index=Number(document.getElementById("voiceSelect").value);
speak(line.text,index,next);
}
next();
}
  
let recorder=null;
let recordedChunks=[];

async function exportVideo(){
if(!scenes.length){
alert("Generate a story first.");
return;
}
if(!canvas.captureStream||!window.MediaRecorder){
alert("Video recording is not supported by this browser.");
return;
}
stopScene();
stopVoice();
currentScene=0;
loadScene(0);

const quality=Number(document.getElementById("quality").value);
renderer.setPixelRatio(quality);
renderer.setSize(390,693,false);

const stream=canvas.captureStream(30);
let mime="video/webm;codecs=vp9";
if(!MediaRecorder.isTypeSupported(mime)){
mime="video/webm";
}
if(MediaRecorder.isTypeSupported("video/mp4")){
mime="video/mp4";
}
try{
recorder=new MediaRecorder(stream,{mimeType:mime});
}catch(e){
recorder=new MediaRecorder(stream);
}
recordedChunks=[];
recorder.ondataavailable=e=>{
if(e.data.size)recordedChunks.push(e.data);
};
recorder.onstop=()=>{
const blob=new Blob(recordedChunks,{type:recorder.mimeType});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download=mime.includes("mp4")?"roblox-short.mp4":"roblox-short.webm";
a.click();
setTimeout(()=>URL.revokeObjectURL(url),5000);
document.getElementById("exportStatus").textContent=
"Export complete: "+a.download;
};
document.getElementById("exportStatus").textContent="Recording story...";
recorder.start();

let i=0;
function recordNext(){
if(i>=scenes.length){
recorder.stop();
stream.getTracks().forEach(t=>t.stop());
return;
}
loadScene(i);
const s=scenes[i];
document.getElementById("subtitle").textContent=s.description;
camera.position.set(0,4,11);
camera.lookAt(0,1.5,0);
characters.forEach(c=>c.group.userData.walking=true);
setTimeout(()=>{
characters.forEach(c=>c.group.userData.walking=false);
document.getElementById("subtitle").textContent=s.action;
setTimeout(()=>{
document.getElementById("subtitle").textContent=
s.lines.map(l=>l.speaker+": "+l.text).join("  ");
setTimeout(()=>{
document.getElementById("subtitle").textContent=s.end;
i++;
recordNext();
},Math.max(3000,s.duration*400));
},1800);
},1800);
}
recordNext();
}

function saveProject(){
const data={
scenes,
characters:characters.map(c=>({
name:c.name,color:c.color,skin:c.skin
})),
topic:document.getElementById("storyTopic").value,
genre:document.getElementById("genre").value
};
localStorage.setItem("roblox3DProject",JSON.stringify(data));
alert("Project saved on this device.");
}

function loadProject(){
const raw=localStorage.getItem("roblox3DProject");
if(!raw)return alert("No saved project found.");
try{
const data=JSON.parse(raw);
scenes=data.scenes||[];
document.getElementById("storyTopic").value=data.topic||"";
document.getElementById("genre").value=data.genre||"Comedy";
renderStory();
loadScene(0);
alert("Project loaded.");
}catch(e){
alert("Could not load saved project.");
}
}

function downloadProject(){
const data=JSON.stringify({
scenes,
topic:document.getElementById("storyTopic").value
},null,2);
const blob=new Blob([data],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="roblox-story-project.json";
a.click();
setTimeout(()=>URL.revokeObjectURL(url),3000);
}

function importProject(file){
const reader=new FileReader();
reader.onload=()=>{
try{
const data=JSON.parse(reader.result);
scenes=data.scenes||[];
document.getElementById("storyTopic").value=data.topic||"";
renderStory();
loadScene(0);
}catch(e){alert("Invalid project file.");}
};
reader.readAsText(file);
}
  
function generateSEO(){
const topic=document.getElementById("storyTopic").value.trim()||"Roblox story";
const genre=document.getElementById("genre").value;
const title=topic.length>55?topic.slice(0,52)+"...":topic;
const titles=[
"😱 "+title+" | Roblox Story",
"What Happens Next? 🤯 Roblox Shorts",
"You Won't Believe This Roblox Ending!",
"😂 The Funniest Roblox Story Ever!",
"Roblox "+genre+" Story | Wait For The Twist!"
];
const hashtags="#Roblox #RobloxShorts #Gaming #Shorts #"+genre.replace(/\s/g,"");
const description=
"Watch this Roblox-inspired "+genre.toLowerCase()+" story!\n\n"+
topic+"\n\n"+
"Enjoy the story? Like, comment and subscribe for more Roblox Shorts!\n\n"+
hashtags;
const tags="Roblox, Roblox Shorts, Roblox story, Roblox animation, gaming shorts, "+genre+", funny Roblox, Roblox roleplay";
const out=document.getElementById("seoOutput");
out.innerHTML="";
function addCopy(title,value){
const box=document.createElement("div");
box.className="sceneCard";
const h=document.createElement("h4");
h.textContent=title;
const p=document.createElement("p");
p.textContent=value;
const b=document.createElement("button");
b.textContent="Copy";
b.onclick=()=>navigator.clipboard.writeText(value).then(
()=>b.textContent="Copied!"
).catch(()=>alert("Copy not supported. Select and copy the text."));
box.append(h,p,b);
out.appendChild(box);
}
titles.forEach((t,i)=>addCopy("Title option "+(i+1),t));
addCopy("Description and hashtags",description);
addCopy("YouTube tags",tags);
}

const savePanel=document.createElement("section");
savePanel.className="panel";
savePanel.innerHTML=`
<h3>💾 Project Manager</h3>
<button id="saveBtn">Save Project</button>
<button id="loadBtn">Load Project</button>
<button id="downloadBtn">Download JSON</button>
<label class="small">Import project JSON</label>
<input type="file" id="importFile" accept=".json,application/json">
`;
document.querySelector("main").appendChild(savePanel);

document.getElementById("saveBtn").onclick=saveProject;
document.getElementById("loadBtn").onclick=loadProject;
document.getElementById("downloadBtn").onclick=downloadProject;
document.getElementById("importFile").onchange=e=>{
if(e.target.files[0])importProject(e.target.files[0]);
};

buildEnvironment("Street");
loadScene(0);
renderCharacterList();

window.addEventListener("beforeunload",()=>{
stopScene();
stopVoice();
});
</script>
</body>
</html>
